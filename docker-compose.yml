services:
  register-service:
    build:
      context: ./register-service
    container_name: registration-microservice
    env_file:
      - ./register-service/.env
    ports:
      - "5001:5001"
    restart: unless-stopped

  login-service:
    build:
      context: ./login-service
    container_name: login-microservice
    env_file:
      - ./login-service/.env
    ports:
      - "5002:5002"
    restart: unless-stopped
